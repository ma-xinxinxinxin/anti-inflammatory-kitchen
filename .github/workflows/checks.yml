name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py --check
      - run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
